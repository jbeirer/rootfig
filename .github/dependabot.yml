version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Floors in pyproject.toml are raised by hand (see the "minimum-versions" CI job).
    versioning-strategy: lockfile-only
    groups:
      dev-tools:
        patterns: [pytest, pytest-*, ruff, mypy]
        update-types: [minor, patch]
      docs:
        patterns: [mkdocs, mkdocs-*, mkdocstrings, mkdocstrings-*]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit-hooks:
        patterns: ["*"]
