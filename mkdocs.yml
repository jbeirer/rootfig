site_name: rootfig
site_description: Publication-quality figures straight from ROOT trees, without ROOT.
site_url: https://jbeirer.github.io/rootfig/
repo_url: https://github.com/jbeirer/rootfig
repo_name: jbeirer/rootfig
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes      # the Gallery section opens its overview
    - navigation.footer       # previous/next page, e.g. from example to example
    - navigation.top
    - content.code.copy
    - content.tabs.link       # choosing a style in one tab set switches all of them
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Gallery: gallery/index.md  # docs/hooks/gallery.py adds a page per example, by section
  - Expressions and selections: expressions.md
  - Samples, variables, cuts and styles: composable.md
  - Plotting options: plotting.md
  - Ecosystem: ecosystem.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.blocks.tab:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.blocks.details
  - pymdownx.blocks.html
  - attr_list

extra_css:
  - stylesheets/gallery.css

exclude_docs: |
  hooks/

hooks:
  - docs/hooks/gallery.py

watch:
  - examples/gallery

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
